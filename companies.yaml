# Watchlist. Everything under `defaults` applies to every company and can be
# overridden per company by repeating the key inside that company's entry.

defaults:
  # Sent to each site's own search box. Keep these broad; `title` does the narrowing.
  search:
    - software engineer
    - software developer

  title:
    # A job is kept if its title contains at least one of these...
    include:
      - software engineer
      - software developer
      - software development engineer
      - software dev engineer
      - sw engineer
      - sde
    # ...and none of these.
    exclude:
      - intern
      - internship
      - apprentice
      - staff
      - lead
      - principal
      - distinguished
      - architect
      - director
      - manager
      - mgr
      - vp
      - vice president
      - head

  # Sites that can filter by country on their side (Workday, Oracle, Eightfold,
  # Amazon, Google) only return jobs in this country, which keeps runs fast.
  country: India

  # Cities are listed because some sites omit the country (Walmart writes "IN KA BANGALORE").
  locations:
    - india
    - bangalore
    - bengaluru
    - hyderabad
    - chennai
    - pune
    - mumbai
    - gurgaon
    - gurugram
    - noida
    - delhi
    - kolkata

  # Compared with the years of experience stated in the job description.
  # Jobs that state no figure are always kept.
  experience:
    min_years: 2      # drop roles asking for less than this (entry level)
    max_years: null   # e.g. 5 to drop roles asking for more than 5 years

  skills:
    prefer: [java, c++]   # tagged in the alert and listed first
    required: false       # true = drop jobs that mention none of them

companies:
  - name: JPMorgan Chase
    type: oracle
    url: https://jpmc.fa.oraclecloud.com/hcmUI/CandidateExperience/en/sites/CX_1001

  - name: Walmart
    type: workday
    url: https://walmart.wd504.myworkdayjobs.com/WalmartExternal

  - name: Visa
    type: workday
    url: https://visa.wd5.myworkdayjobs.com/Visa

  - name: NetApp
    type: talentbrew
    url: https://careers.netapp.com

  - name: EY
    type: successfactors
    url: https://careers.ey.com/ey
    search: [java, c++, software engineer]   # EY rarely uses 'software engineer' in titles
    title:
      include: [software engineer, software developer, java, c++]
      # no "staff" here: at EY it is the entry-level grade, not a senior one
      exclude: [intern, internship, lead, principal, architect, director, manager, vice president]
    max_jobs: 300   # results are newest-first, so the first pages are enough

  # --- Big tech ---
  - name: Amazon
    type: amazon

