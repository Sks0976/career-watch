name: Career watch

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours (UTC); GitHub may start it a few minutes late
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: career-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install browser (only when a company needs it)
        run: |
          if python -m careerwatch --needs-browser; then
            python -m playwright install --with-deps chromium
          fi

      - name: Check career pages
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m careerwatch

      - name: Save seen jobs
        if: always()
        run: |
          git config user.name "career-watch"
          git config user.email "actions@users.noreply.github.com"
          git add state
          git diff --cached --quiet || git commit -m "Update seen jobs"
          git push
